<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NYC Restaurant Explorer</title>
</head>
<body>
    <h1>NYC Restaurant Explorer</h1>

    <form method="get">
        <input
            type="text"
            name="q"
            placeholder="Search by name"
            value="{{ query }}"
        >

        <select name="borough">
            <option value="">All boroughs</option>
            {% for borough in boroughs %}
            <option value="{{ borough }}" {% if borough == selected_borough %}selected{% endif %}>{{ borough }}</option>
            {% endfor %}
        </select>

        <select name="cuisine">
            <option value="">All cuisines</option>
            {% for cuisine in cuisines %}
            <option value="{{ cuisine }}" {% if cuisine == selected_cuisine %}selected{% endif %}>{{ cuisine }}</option>
            {% endfor %}
        </select>

        <button type="submit">Search</button>
    </form>

    {% if restaurants %}
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Borough</th>
                <th>Cuisine</th>
                <th>Address</th>
            </tr>
        </thead>
        <tbody>
            {% for restaurant in restaurants %}
            <tr>
                <td>{{ restaurant.name }}</td>
                <td>{{ restaurant.borough }}</td>
                <td>{{ restaurant.cuisine }}</td>
                <td>{{ restaurant.address }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No restaurants found.</p>
    {% endif %}
</body>
</html>
